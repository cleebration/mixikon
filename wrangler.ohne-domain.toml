# mixikon.com – Website + Vorschläge (Cloudflare Worker mit statischen Dateien und D1)
# Projekt "MyProj Mixikon", Claude, 28.10.2026
name = "mixikon"
main = "src/index.js"
compatibility_date = "2026-01-01"
