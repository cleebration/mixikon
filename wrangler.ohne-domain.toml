# Ohne eigene Domain – nur mixikon.<konto>.workers.dev (Zwischenlösung)

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mixikon"
database_id = "1641d492-c5d4-4aee-8102-e3b975af12ff"
